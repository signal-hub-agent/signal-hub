version: '3.8'

services:
  # ==========================================
  # Zookeeper (Kafka 的依赖协调组件)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: signal_hub_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - ./zookeeper_data:/var/lib/zookeeper/data
      - ./zookeeper_log:/var/lib/zookeeper/log
    networks:
      - signal_hub_net

  # ==========================================
  # Kafka (实时数据总线)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: signal_hub_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    networks:
      - signal_hub_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: signal_hub_kafka_ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: Local-SignalHub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - signal_hub_net

  # ==========================================
  # ClickHouse (核心数据仓库)
  # ==========================================
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: signal_hub_clickhouse
    ports:
      - "8123:8123" # HTTP 端口，供 Python (clickhouse-driver) 和 DBeaver 使用
      - "9000:9000" # Native 端口，供 Flink / Java JDBC 使用
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DB: signal_hub
    volumes:
      # 🌟 修改 1：将 ./clickhouse_data 替换为具名卷 clickhouse_native_data
      - clickhouse_native_data:/var/lib/clickhouse
      # 保持建表 SQL 的挂载不变（由于这是只读读取，不会引发权限报错）
      - ./clickhouse_schema:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - signal_hub_net

  # ==========================================
  # Redis (后端 API 高速缓存与限流组件 - 预留)
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: signal_hub_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - signal_hub_net

    # ==========================================
    # PostgreSQL (元数据与关系型业务库)
    # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: signal_hub_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signal_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - signal_hub_net

volumes:
  clickhouse_native_data:
  postgres_data:

networks:
  signal_hub_net:
    driver: bridge